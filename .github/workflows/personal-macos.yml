name: 'Personal macOS build'

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/auto-best-server'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-MacOS:
    runs-on: macos-15

    env:
      QT_VERSION: 6.10.1
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        # ad-hoc signature, no Developer ID
        CODESIGN_SIGNATURE: '-'
      shell: bash
      run: deploy/build.sh --generator Ninja --installer productbuild

    - name: 'Upload installer'
      uses: actions/upload-artifact@v7
      with:
        name: macos-pkg
        path: deploy/build/AmneziaVPN_*_macos_x64.pkg
        retention-days: 7
