name: 'Personal macOS build'

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/auto-best-server'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-MacOS:
    runs-on: macos-15

    env:
      QT_VERSION: 6.10.1
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      # public build-time values, the same nixpkgs extracted from the official binary: storage and
      # fallback endpoints let Premium reach the gateway through proxies when gw.amnezia.org is blocked
      PROD_S3_ENDPOINT: 'https://s3.eu-north-1.amazonaws.com/amnezia/, https://storage.googleapis.com/lambda-list/, https://amnzstrg01.blob.core.windows.net/lambda-list/, https://objectstorage.eu-zurich-1.oraclecloud.com/n/zrhfyaq6qxvh/b/lambda-list/o/'
      FALLBACK_S3_ENDPOINT: 'https://storage.mwsapis.ru/lambda-list/, https://46.8.209.252/lambda-list/'
      FREE_V2_ENDPOINT: '13.248.139.44'
      PREM_V1_ENDPOINT: '52.223.54.40'

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    # a stable self-signed identity: the keychain grants the app access to its settings key by
    # signature, and an ad-hoc signature changes with every build
    - name: 'Import signing certificate'
      env:
        CERT_P12_BASE64: ${{ secrets.MAC_PERSONAL_CERT_P12_BASE64 }}
        CERT_PASS: ${{ secrets.MAC_PERSONAL_CERT_PASS }}
      shell: bash
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_pass=$(openssl rand -hex 16)
        security create-keychain -p "$keychain_pass" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_pass" "$keychain"
        echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASS" -T /usr/bin/codesign
        rm "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        identity=$(security find-identity -p codesigning "$keychain" | awk '/AmneziaVPN Personal Code Signing/ {print $2; exit}')
        [ -n "$identity" ] || { echo "signing identity not found"; exit 1; }
        echo "CODESIGN_SIGNATURE=$identity" >> "$GITHUB_ENV"
        echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        CODESIGN_PLAIN: '1'
      shell: bash
      run: |
        deploy/build.sh --generator Ninja --installer productbuild
        codesign -dv --verbose=2 deploy/build/client/AmneziaVPN.app 2>&1 | grep -E "Authority|Identifier|TeamIdentifier" || true

    - name: 'Upload installer'
      uses: actions/upload-artifact@v7
      with:
        name: macos-pkg
        path: deploy/build/AmneziaVPN_*_macos_x64.pkg
        retention-days: 7
