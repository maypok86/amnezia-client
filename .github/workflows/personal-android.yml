name: 'Personal Android build'

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/auto-best-server'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-Android:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      QT_VERSION: 6.10.3
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      APP_ANDROID_MIN_SDK: 28
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      # public build-time values, the same nixpkgs extracted from the official binary: storage and
      # fallback endpoints let Premium reach the gateway through proxies when gw.amnezia.org is blocked
      PROD_S3_ENDPOINT: 'https://s3.eu-north-1.amazonaws.com/amnezia/, https://storage.googleapis.com/lambda-list/, https://amnzstrg01.blob.core.windows.net/lambda-list/, https://objectstorage.eu-zurich-1.oraclecloud.com/n/zrhfyaq6qxvh/b/lambda-list/o/'
      FALLBACK_S3_ENDPOINT: 'https://storage.mwsapis.ru/lambda-list/, https://46.8.209.252/lambda-list/'
      FREE_V2_ENDPOINT: '13.248.139.44'
      PREM_V1_ENDPOINT: '52.223.54.40'

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Decode keystore secret to file'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_PERSONAL_KEYSTORE_BASE64 }}
      shell: bash
      run: echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
        QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_PERSONAL_KEYSTORE_ALIAS }}
        QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_PERSONAL_KEYSTORE_PASS }}
        QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_PERSONAL_KEYSTORE_PASS }}
      shell: bash
      run: |
        deploy/build.sh -t android --sign --abi arm64-v8a
        VERSION=$(grep CMAKE_PROJECT_VERSION:STATIC deploy/build/CMakeCache.txt | cut -d= -f2)
        mkdir -p deploy/artifacts
        mv deploy/build/client/android-build/AmneziaVPN.apk \
           deploy/artifacts/AmneziaVPN-Personal_${VERSION}_arm64-v8a.apk

    - name: 'Upload APK'
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: deploy/artifacts/*.apk
        retention-days: 7
